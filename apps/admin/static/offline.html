<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#31543B" />
    <title>Offline — Eglise</title>
    <style>
      :root {
        color: #24271f;
        background: #f7f3ea;
        font-family: 'Avenir Next', Avenir, 'Segoe UI', sans-serif;
      }
      body {
        max-width: 640px;
        margin: 0 auto;
        padding: 72px 24px;
      }
      h1 {
        margin: 0;
        font:
          400 clamp(2rem, 8vw, 3rem)/1.12 'Iowan Old Style',
          'Palatino Linotype',
          Georgia,
          serif;
      }
      p {
        max-width: 56ch;
        color: #62695a;
        font-size: 1rem;
        line-height: 1.5;
      }
      a {
        display: inline-block;
        min-height: 44px;
        box-sizing: border-box;
        margin-top: 16px;
        padding: 10px 14px;
        border-radius: 8px;
        color: #fff;
        background: #31543b;
        font-weight: 600;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 3px solid #3f6275;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <p>Fictional-data pilot</p>
    <h1>This pilot needs a connection</h1>
    <p>
      People records, imports, and entered information are never cached or stored offline.
      Reconnect, then return to the People directory.
    </p>
    <a href="/people">Try People directory again</a>
  </body>
</html>
