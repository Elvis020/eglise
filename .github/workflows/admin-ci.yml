name: Admin app CI

on:
  push:
    branches:
      - main
    paths:
      - apps/admin/**
      - .github/workflows/admin-ci.yml
  pull_request:
    paths:
      - apps/admin/**
      - .github/workflows/admin-ci.yml

permissions:
  contents: read

concurrency:
  group: admin-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify admin app
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/admin

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate SvelteKit configuration
        run: npx svelte-kit sync

      - name: Check formatting
        run: npm run format

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm run test

      - name: Type-check Svelte
        run: npm run check

      - name: Build for Cloudflare
        run: npm run build
