name: Sync stakeholder site

on:
  push:
    branches:
      - main
    paths:
      - index.html
      - styles.css
      - script.js
      - .github/workflows/sync-stakeholder-site.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stakeholder-site-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out private source
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Sync public stakeholder site
        env:
          EGLISE_SITE_DEPLOY_KEY: ${{ secrets.EGLISE_SITE_DEPLOY_KEY }}
        run: |
          set -euo pipefail

          key_file="$(mktemp "${RUNNER_TEMP}/eglise-site-key.XXXXXX")"
          known_hosts_file="${RUNNER_TEMP}/eglise-site-known-hosts"

          cleanup() {
            rm -f "$key_file"
          }

          trap cleanup EXIT
          chmod 600 "$key_file"
          printf '%s\n' "$EGLISE_SITE_DEPLOY_KEY" > "$key_file"

          curl --fail --silent --show-error https://api.github.com/meta \
            | jq -r '.ssh_keys[] | "github.com " + .' > "$known_hosts_file"

          if [[ ! -s "$known_hosts_file" ]]; then
            echo "GitHub SSH host keys were not returned." >&2
            exit 1
          fi

          export GIT_SSH_COMMAND="ssh -i ${key_file} -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=${known_hosts_file}"
          git clone --branch main --single-branch git@github.com:Elvis020/eglise-site.git "${RUNNER_TEMP}/eglise-site"

          cd "${RUNNER_TEMP}/eglise-site"

          for asset in index.html styles.css script.js; do
            if [[ ! -f "${GITHUB_WORKSPACE}/${asset}" || -L "${GITHUB_WORKSPACE}/${asset}" ]]; then
              echo "Required source asset is missing or is not a regular file: ${asset}" >&2
              exit 1
            fi
          done

          cp "${GITHUB_WORKSPACE}/index.html" index.html
          cp "${GITHUB_WORKSPACE}/styles.css" styles.css
          cp "${GITHUB_WORKSPACE}/script.js" script.js

          git add -- index.html styles.css script.js

          if git diff --cached --quiet; then
            echo "Stakeholder site assets are already up to date."
            exit 0
          fi

          git config user.name "Eglise Site Sync Bot"
          git config user.email "eglise-site-sync[bot]@users.noreply.github.com"
          git commit -m "Sync stakeholder site from ${GITHUB_SHA}"

          git push origin main
